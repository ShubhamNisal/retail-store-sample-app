Version: '2012-10-17'
Statement:
  - Effect: Allow
    Action:
      - ecr:GetAuthorizationToken
    Resource: '*'
  - Effect: Allow
    Action:
      - ecr:BatchCheckLayerAvailability
      - ecr:GetDownloadUrlForLayer
      - ecr:BatchGetImage
      - ecr:PutImage
      - ecr:InitiateLayerUpload
      - ecr:UploadLayerPart
      - ecr:CompleteLayerUpload
    Resource:
      - arn:aws:ecr:*:*:repository/retail-store-ui
      - arn:aws:ecr:*:*:repository/retail-store-catalog
      - arn:aws:ecr:*:*:repository/retail-store-cart
      - arn:aws:ecr:*:*:repository/retail-store-orders
      - arn:aws:ecr:*:*:repository/retail-store-checkout
